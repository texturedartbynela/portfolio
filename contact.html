<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>اتصل بنا | art by nela</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f5f5;
            color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .card {
            background: white;
            border-radius: 25px;
            padding: 40px 30px;
            box-shadow: 0 8px 30px #00000012;
            text-align: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .title {
            font-size: 35px;
            margin-bottom: 12px;
        }

        .description {
            color: #666;
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .contact-box {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #f7f7f7;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 15px;
            text-decoration: none;
            color: #111;
            transition: 0.25s;
        }

        .contact-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px #00000012;
        }

        .icon {
            width: 50px;
            height: 50px;
            background: #111;
            color: white;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .contact-text {
            text-align: right;
        }

        .contact-text h3 {
            margin-bottom: 5px;
            font-size: 17px;
        }

        .contact-text p {
            color: #666;
            font-size: 14px;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: #111;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        /* الوضع الداكن */
        body.dark {
            background: #111;
            color: white;
        }

        body.dark .card {
            background: #1c1c1c;
        }

        body.dark .description,
        body.dark .contact-text p {
            color: #aaa;
        }

        body.dark .contact-box {
            background: #252525;
            color: white;
        }

        body.dark .back {
            color: white;
        }

        /* الهاتف */
        @media (max-width: 500px) {
            .card {
                padding: 30px 20px;
            }

            .title {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">

            <div class="logo">art by nela</div>

            <h1 class="title">تواصل معنا</h1>

            <p class="description">
                إذا عندك أي استفسار أو حاب تطلب منتج،
                تواصل معنا عبر واتساب أو البريد الإلكتروني.
            </p>


            <!-- واتساب -->
            <a
                class="contact-box"
                href="https://wa.me/213672220193"
                target="_blank"
            >
                <div class="icon">📞</div>

                <div class="contact-text">
                    <h3>واتساب</h3>
                    <p></p>
                </div>
            </a>


            <!-- البريد الإلكتروني -->
            <a
                class="contact-box"
                href="mailto:ammarimanel48@gmail.com"
            >
                <div class="icon">✉️</div>

                <div class="contact-text">
                    <h3>البريد الإلكتروني</h3>
                    <p>ammarimanel48@gmail.com</p>
                </div>
            </a>


            <!-- العودة للرئيسية -->
            <a class="back" href="index.html">
                ← العودة إلى الصفحة الرئيسية
            </a>

        </div>

    </div>

</body>
</html>
