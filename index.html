<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>nela</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #111;
            transition: 0.3s;
            padding-bottom: 80px;
        }

        /* الشريط العلوي */
        header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-shadow: 0 2px 10px #00000015;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .theme-btn {
            border: none;
            background: #111;
            color: white;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* العنوان */
        .hero {
            text-align: center;
            padding: 50px 20px 30px;
        }

        .hero h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #666;
            font-size: 17px;
        }

        /* البحث */
        .search {
            display: block;
            width: 90%;
            max-width: 600px;
            margin: 10px auto 30px;
            padding: 15px 20px;
            border: none;
            border-radius: 30px;
            outline: none;
            box-shadow: 0 2px 15px #00000012;
            font-size: 16px;
        }

        /* المنتجات */
        .products {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .product {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 4px 15px #00000012;
            transition: 0.25s;
        }

        .product:hover {
            transform: translateY(-5px);
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .product-info {
            padding: 18px;
        }

        .product-info h3 {
            margin-bottom: 8px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .buy-btn {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 10px;
            background: #111;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        /* زر الاتصال */
        .contact {
            display: block;
            width: 90%;
            max-width: 500px;
            margin: 40px auto;
            padding: 15px;
            text-align: center;
            text-decoration: none;
            background: #111;
            color: white;
            border-radius: 12px;
        }

        /* الشريط السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -2px 10px #00000015;
            z-index: 20;
        }

        .bottom-nav a {
            text-decoration: none;
            color: #333;
            font-size: 13px;
        }

        /* الوضع الداكن */
        body.dark {
            background: #111;
            color: white;
        }

        body.dark header,
        body.dark .bottom-nav,
        body.dark .product {
            background: #1c1c1c;
        }

        body.dark .hero p {
            color: #aaa;
        }

        body.dark .search {
            background: #222;
            color: white;
        }

        body.dark .bottom-nav a {
            color: #ddd;
        }

        body.dark .theme-btn {
            background: white;
            color: black;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">art by nela</div>

        <button class="theme-btn" onclick="toggleTheme()">
            🌙 mode
        </button>
    </header>

    <section class="hero">
        <h1>اكتشف ما تريد</h1>
        <p>تستطيع شراء ما تحب</p>
    </section>

    <input
        class="search"
        type="text"
        placeholder="🔎 ابحث عن منتج..."
    >

    <section class="products">

        <div class="product">
            <img src="https://i.pinimg.com/1200x/e2/3d/cf/e23dcf63c481a2f5db8a7f3448db01a7.jpg">

            <div class="product-info">
                <h3>لوحة جديدة </h3>
                <div class="price">8,000 DA</div>
                <button class="buy-btn">أريد شراء هذا</button>
            </div>
        </div>

        <div class="product">
            <img src="https://i.pinimg.com/1200x/90/25/8e/90258ec1cbc4cd2b2ab6c11d77c28916.jpg">

            <div class="product-info">
                <h3>لوحة جديدة</h3>
                <div class="price">5,500 DA</div>
                <button class="buy-btn">أريد شراء هذا</button>
            </div>
        </div>

        <div class="product">
            <img src="https://i.pinimg.com/736x/d6/a1/b2/d6a1b2800846a554fb7dae9cf0561f73.jpg">

            <div class="product-info">
                <h3> لوحة جديدة</h3>
                <div class="price">12,000 DA</div>
                <button class="buy-btn">أريد شراء هذا</button>
            </div>
        </div>

    </section>

    <a class="contact" href="#">
        📞 اتصل بنا
    </a>

    <nav class="bottom-nav">
        <a href="#">🏠 الرئيسية</a>
        <a href="#">🛍️ المنتجات</a>
        <a href="#">👤 حسابي</a>
    </nav>

    <script>
        function toggleTheme() {
            document.body.classList.toggle("dark");
        }
    </script>

</body>
</html>
